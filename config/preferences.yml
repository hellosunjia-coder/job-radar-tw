# Matching preferences used by every profile. Location matching is case-insensitive.
# An empty location_terms list accepts any non-remote location.
preferences:
  location_terms:
    - Austin
    - San Francisco
    - San Jose
    - Oakland
    - Bay Area
    - Seattle
  include_remote: true
  exclude_citizenship_required: true
  exclude_clearance_required: true
  excluded_seniorities:
    - entry
    - director_plus
